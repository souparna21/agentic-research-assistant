[project]
name = "ara"
version = "0.1.0"
description = "Agentic Research Assistant — multi-agent RAG literature review pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Souparna Bhowmik" },
    { name = "Damor Jaydipkumar" },
    { name = "Akash Sansugu Palaniswami" },
]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "litellm>=1.55,<2",
    "typer>=0.15,<0.16",
    "structlog>=25.1,<26",
    "jinja2>=3.1.6,<4",
    "python-slugify>=8,<9",
    "semanticscholar>=0.12,<0.13",
    "arxiv>=3.0,<4",
    "tenacity>=9.1,<10",
    "pymupdf==1.27.2.2",
    "pymupdf4llm==1.27.2.2",
    "sentence-transformers>=5.4,<6",
    "faiss-cpu>=1.13,<2",
    "tiktoken>=0.12,<0.13",
    "Unidecode>=1.4,<2",
]

[project.scripts]
ara = "ara.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-mock>=3.14,<4",
    "respx>=0.22,<0.23",
    "pytest-socket>=0.7,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
    "types-python-slugify",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ara"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "T20", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket --allow-unix-socket"
markers = [
    "live: hits real external APIs (deselect by default)",
    "smoke: end-to-end stub pipeline",
    "integration: requires external binaries/services (e.g. pre-commit + gitleaks)",
    "latex: requires latexmk binary (skipped via @pytest.mark.latex when absent)",
]
